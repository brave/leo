name: Publish
on:
  push:
    branches: [main]
    paths: [package.json]
  workflow_dispatch:

permissions:
  contents: write # create tag + GitHub release
  id-token: write # npm trusted publishing (OIDC)
  actions: write # dispatch Prepare Release after tagging

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1

      - uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
        with:
          run_install: false

      - uses: actions/setup-node@395ad3262231945c25e8478fd5baf05154b1d79f # v6.1.0
        with:
          node-version-file: '.node-version'
          registry-url: 'https://registry.npmjs.org'
          cache: 'pnpm'
          cache-dependency-path: '**/pnpm-lock.yaml'

      - name: Check whether version is already published
        id: check
        run: |
          NAME="$(node -p "require('./package.json').name")"
          VERSION="$(node -p "require('./package.json').version")"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

          # Pull this version's section out of CHANGELOG.md for the release notes.
          NOTES="$RUNNER_TEMP/release-notes.md"
          awk -v v="$VERSION" '
            $0 == "## " v { found = 1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > "$NOTES"
          echo "notes=$NOTES" >> "$GITHUB_OUTPUT"

          if npm view "$NAME@$VERSION" version >/dev/null 2>&1; then
            echo "$NAME@$VERSION is already on npm; skipping publish."
            echo "published=true" >> "$GITHUB_OUTPUT"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
            # Fail before publishing, while it's still cheap to fix.
            if ! grep -q '[^[:space:]]' "$NOTES"; then
              echo "::error::CHANGELOG.md has no entry for $VERSION"
              exit 1
            fi
          fi

      - name: Install dependencies
        if: steps.check.outputs.published == 'false'
        run: |
          pnpm install --frozen-lockfile
          # Build scripts are gated by `allowBuilds` in pnpm-workspace.yaml.
          # Please check with Brave's security team prior to adding any packages to that list.

      - name: Publish
        if: steps.check.outputs.published == 'false'
        run: pnpm publish --no-git-checks --access public

      - name: Create tag and GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.check.outputs.tag }}
          VERSION: ${{ steps.check.outputs.version }}
          NOTES: ${{ steps.check.outputs.notes }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; nothing to do."
            exit 0
          fi
          if ! grep -q '[^[:space:]]' "$NOTES"; then
            echo "::warning::CHANGELOG.md has no entry for $VERSION; using placeholder release notes."
            echo "See CHANGELOG.md." > "$NOTES"
          fi
          gh release create "$TAG" \
            --target "$GITHUB_SHA" \
            --title "$TAG" \
            --notes-file "$NOTES"

          # Commits pushed while this ran were skipped by Prepare Release
          # (no tag yet); kick it now so the next release PR picks them up.
          gh workflow run prepare-release.yml --ref main
