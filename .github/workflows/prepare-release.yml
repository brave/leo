name: Prepare Release
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'New major version number (e.g. 2)'
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          fetch-depth: 0
          fetch-tags: true

      - uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
        with:
          run_install: false

      - uses: actions/setup-node@395ad3262231945c25e8478fd5baf05154b1d79f # v6.1.0
        with:
          node-version-file: '.node-version'
          cache: 'pnpm'
          cache-dependency-path: '**/pnpm-lock.yaml'

      - name: Validate version input
        run: |
          if ! [[ "${{ inputs.version }}" =~ ^[0-9]+$ ]]; then
            echo "::error::version must be a plain integer, e.g. 2"
            exit 1
          fi

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Bump version
        run: pnpm pkg set version="${{ inputs.version }}.0.0"

      - name: Generate changelog
        run: pnpm run changelog

      - name: Open release PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BRANCH="release/v${{ inputs.version }}"
          git config user.name "brave-builds"
          git config user.email "devops@brave.com"
          git checkout -b "$BRANCH"
          git add package.json CHANGELOG.md
          git commit -m "chore: release v${{ inputs.version }}"
          git push origin "$BRANCH"
          gh pr create \
            --title "chore: release v${{ inputs.version }}" \
            --body "Version bump and changelog for v${{ inputs.version }}. Merging this does **not** publish — after merging, push the \`v${{ inputs.version }}\` tag from \`main\` to trigger the Publish workflow." \
            --base main \
            --head "$BRANCH"
